<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ajouter à mon calendrier | IDILLE</title><style>body{margin:0;background:#f7f4f1;font-family:Arial,sans-serif;color:#30221e;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:white;padding:38px 28px;border-radius:16px;box-shadow:0 8px 35px #30221e18;max-width:440px;width:85%;text-align:center}h1{font-size:27px}p{line-height:1.6}a.btn{display:block;background:#50372e;color:white;text-decoration:none;padding:16px;margin:13px 0;border-radius:7px;font-weight:bold}a.btn:hover{background:#735044}.note{font-size:13px;color:#756963}</style></head><body><main class="card"><h1>Avant-première<br>« Papa où t'es ? »</h1><p><strong>Mardi 20 octobre 2026</strong><br>17h30 – 20h30 (heure de Paris)</p><p>Choisissez votre calendrier :</p><a class="btn" id="google" href="#">Google Calendar</a><a class="btn" id="outlook" href="#">Outlook (web)</a><a class="btn" href="papa-ou-t-es.ics" download>Apple / iPhone / Mac et fichier ICS</a><p class="note">Ouverture des files d'attente : 17h30<br>Ouverture des portes : 18h<br>Fermeture des portes : 19h30</p></main><script>const title="Avant-première Papa où t'es ?",description="Ouverture des files d’attente : 17h30\nOuverture des portes : 18h\nFermeture des portes : 19h30";document.getElementById('google').href='https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:title,dates:'20261020T153000Z/20261020T183000Z',details:description,ctz:'Europe/Paris'});document.getElementById('outlook').href='https://outlook.live.com/calendar/0/deeplink/compose?'+new URLSearchParams({path:'/calendar/action/compose',rru:'addevent',subject:title,startdt:'2026-10-20T15:30:00Z',enddt:'2026-10-20T18:30:00Z',body:description});</script></body></html>
